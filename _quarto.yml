project:
  type: book
  output-dir: _book
  resources:
    - "material/**"
    - "images/**"
  render:
    - "*.qmd"
    - "start/*.qmd"
    - "prompting/*.qmd"
    - "kontext/*.qmd"
    - "qualitaet/*.qmd"
    - "verantwortung/*.qmd"
    - "transfer/*.qmd"
    - "praxis/*.qmd"

lang: de
execute:
  freeze: auto

book:
  title: "Working with GenAI"
  description: "Generative KI verstehen, Anwendungsfälle finden und im Arbeitsalltag einsetzen"
  author: "Jan Kirenz"
  page-navigation: true
  search:
    type: overlay
  page-footer:
    left: "© [Jan Kirenz](https://www.kirenz.com/), 2026"
  chapters:
    - part: "Generative KI verstehen und Anwendungsfälle finden"
      chapters:
        - index.qmd
        - start/wie-generative-ki-arbeitet.qmd
        - start/werkzeuge-ueberblick.qmd
        - start/erster-chat.qmd
        - start/datenregeln.qmd
        - start/grenzen-daten.qmd
        - start/use-cases-finden.qmd
        - start/use-cases-bewerten.qmd
        - start/anwendungsfall.qmd
    - part: "Prompting und Zusammenarbeit im Dialog"
      chapters:
        - prompting/prompting-grundlagen.qmd
        - prompting/arbeitsauftrag.qmd
        - prompting/beispiele-format.qmd
        - prompting/iterieren.qmd
    - part: "Kontext, Dokumente und Recherche"
      chapters:
        - kontext/kontextfenster.qmd
        - kontext/material-auswaehlen.qmd
        - kontext/prompt-injection.qmd
        - kontext/regeln-quellen.qmd
        - kontext/material-finden.qmd
        - kontext/websuche.qmd
    - part: "Ergebnisse beurteilen und verbessern"
      chapters:
        - qualitaet/ergebnisqualitaet.qmd
        - qualitaet/aussagen-pruefen.qmd
        - qualitaet/testfaelle.qmd
        - qualitaet/toolvergleich.qmd
    - part: "Daten, Rechte und Verantwortung"
      chapters:
        - verantwortung/datenschutz.qmd
        - verantwortung/urheberrecht.qmd
        - verantwortung/verzerrungen.qmd
        - verantwortung/ki-kompetenz.qmd
    - part: "Wiederverwenden und Arbeitsabläufe gestalten"
      chapters:
        - transfer/arbeitsweise-waehlen.qmd
        - transfer/wiederverwenden.qmd
        - transfer/miniworkflow.qmd
        - transfer/transferplan.qmd
    - part: "Freiwillige Vertiefung"
      chapters:
        - praxis/codex-claude-code.qmd
    - part: "Nachschlagen"
      chapters:
        - lernweg.qmd
        - werkzeugkompass.qmd
        - kursuebersicht.qmd

format:
  html:
    toc: true
    theme: [cosmo, book-theme.scss]
    code-copy: true
    highlight-style: github
    code-overflow: wrap
    author-meta: "Jan Kirenz"
    callout-appearance: simple
